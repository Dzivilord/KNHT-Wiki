<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý nguyên liệu</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<header class="topbar">
    <div class="wrap admin-nav">
        <a class="brand" href="./index.html">Game Wiki</a>
        <a href="./admin.html">← Quản lý tướng</a>
    </div>
</header>

<main class="wrap page admin-page">

    <div class="admin-title">

        <div>
            <h1>Quản lý nguyên liệu</h1>
            <p class="muted">
                Các ID material trong hero mới sẽ tự xuất hiện ở đây.
            </p>
        </div>

        <div class="admin-actions">

            <button
                id="new-material"
                class="button primary"
            >
                + Nguyên liệu mới
            </button>

            <button
                id="export-json"
                class="button"
            >
                Tải đồng bộ materials.json
            </button>

            <button
                id="reload-json"
                class="button"
                type="button"
            >
                Đồng bộ từ file JSON
            </button>

        </div>

    </div>

    <div class="admin-layout">

        <section class="admin-list-panel">

            <input
                id="material-search"
                class="admin-search"
                placeholder="Tìm theo tên hoặc ID..."
            >

            <div id="material-list"></div>

        </section>

        <section class="admin-editor">

            <form id="material-form">

                <div class="editor-heading">

                    <h2 id="editor-title">
                        Nguyên liệu
                    </h2>

                    <button
                        type="button"
                        id="duplicate-material"
                        class="button"
                    >
                        Nhân bản
                    </button>

                </div>

                <div class="form-grid">

                    <label>
                        ID
                        <input name="id" required>
                    </label>

                    <label>
                        Tên
                        <input name="name" required>
                    </label>

                    <label class="wide">
                        Ảnh chính
                        <textarea
                            name="images"
                            rows="3"
                        ></textarea>
                    </label>

                    <label class="wide">
                        Mô tả
                        <textarea
                            name="description"
                            rows="4"
                        ></textarea>
                    </label>

                    <label class="wide">
                        Ảnh thông tin
                        <textarea
                            name="infoImages"
                            rows="3"
                        ></textarea>
                    </label>

                </div>

                <h3>Shop trao đổi</h3>

                <div
                    id="shop-options"
                    class="check-options"
                ></div>

                <h3>Nguồn farm</h3>

                <div
                    id="farm-options"
                    class="check-options"
                ></div>

                <h3>Nguyên liệu dùng để đổi</h3>

                <div
                    id="material-options"
                    class="check-options"
                ></div>

                <div class="editor-footer">

                    <button
                        class="button primary"
                        type="submit"
                    >
                        Lưu nguyên liệu
                    </button>

                    <button
                        class="button danger"
                        type="button"
                        id="delete-material"
                    >
                        Xoá
                    </button>

                    <span
                        id="save-status"
                        class="muted"
                    ></span>

                </div>

            </form>

        </section>

    </div>

</main>

<script src="./material-admin.js"></script>

</body>
</html>
